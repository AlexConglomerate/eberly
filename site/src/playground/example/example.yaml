openapi: 3.0.0
info:
  title: Blog API
  version: 1.0.0
paths:
  /posts:
    post:
      operationId: posts.create
      tags: [posts]
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePostDto' }
      responses:
        '201':
          description: The created post.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDto' }
        '400':
          description: Empty title or content.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorDto' }
components:
  schemas:
    CreatePostDto:
      type: object
      required: [title, content]
      properties:
        title: { type: string }
        content: { type: string }
    PostDto:
      type: object
      required: [id, title, content, createdAt, authorId]
      properties:
        id: { type: number }
        title: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        authorId: { type: number }
    ErrorDto:
      type: object
      required: [message]
      properties:
        message: { type: string }
